name: Publish verifiable frontend

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-musegod-fun
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'MuseCity/musegodfun'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Check out the event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.11.1
          package-manager-cache: false

      - name: Verify checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare isolated database tests
        run: docker pull postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73

      - name: Test
        run: npm test

      - name: Set up reviewed Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.0.0

      - name: Verify contracts and reproducible fee artifacts
        run: |
          forge test --root contracts
          npm run build:buyback-engine
          git diff --exit-code -- contracts/artifacts/buyback-v2
          npm run build:base-collector
          git diff --exit-code -- contracts/artifacts/base-collector

      - name: Build frontend once
        run: npm run build

      - name: Check Worker upload without credentials
        run: npx --no-install wrangler versions upload --dry-run --outdir .wrangler/release-dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Validate the frozen build
        run: npx --no-install tsx scripts/release.ts --check-build

      - name: Publish immutable build, activate and verify
        run: npx --no-install tsx scripts/release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4b68bb6b6c38892162610027f25fbb0d
          WRANGLER_SEND_METRICS: 'false'
